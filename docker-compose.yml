version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trainpain-db
    environment:
      POSTGRES_DB: trainpain
      POSTGRES_USER: trainpain_user
      POSTGRES_PASSWORD: trainpain_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainpain_user -d trainpain"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
